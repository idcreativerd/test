ss="label">Pagos</div><div class="value">'+rows.payments+'</div><div class="sub">Registros de pago</div></div></div><section class="section"><h2>Estado de la plataforma</h2><div class="list"><div class="row"><span>Frontend</span><span class="pill">OK</span></div><div class="row"><span>Supabase</span><span class="pill" id="dbState">Conectando…</span></div><div class="row"><span>Diseño responsive</span><span class="pill">OK</span></div><div class="row"><span>Sesión</span><span class="pill" id="sessionState">Demo</span></div></div></section></div></main></div><nav class="mobile"><button>⌂<br>Inicio</button><button>◌<br>CRM</button><button>+<br>Nuevo</button><button>▦<br>Calendario</button><button>☰<br>Menú</button></nav>';

    const call=async(path,body)=>{const res=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+path,{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await res.json();if(!res.ok||!d?.ok)throw new Error(d?.error||"No se pudo completar la acción.");return d};

  async function init(){
    const publicMatch=location.pathname.match(/^\\/p\\/([^/]+)/);
    if(publicMatch){await renderPublicPortal(decodeURIComponent(publicMatch[1]));return}
    // Bind actions before checking external services so Demo always works.
    const loginBtn=document.getElementById("loginBtn"), demoBtn=document.getElementById("demoBtn");
    const signupBtn=document.getElementById("signupBtn");
    if(demoBtn)demoBtn.onclick=async()=>{loadDemo();await openApp(null,"Pedro Ramirez Photos")};
    if(signupBtn)signupBtn.onclick=async function(){
      if(!client){msg("La conexión de cuenta todavía no está disponible. Usa “Ver demo” para entrar ahora.",true);return}
      const email=document.getElementById("email").value.trim(), password=document.getElementById("password").value;
      if(!email||!password){msg("Escribe tu correo y una contraseña para crear la cuenta.",true);return}
      if(password.length<6){msg("La contraseña debe tener al menos 6 caracteres.",true);return}
      msg("Creando cuenta…");
      try{
        const {data,error}=await client.auth.signUp({email,password});
        if(error){
          const m=(error.message||"").toLowerCase();
          if(m.includes("users_email_partial_key")||m.includes("already registered")||m.includes("already exists")||m.includes("duplicate")) throw new Error("Esta cuenta ya existe. Inicia sesión o recupera tu contraseña.");
          throw error;
        }
        if(data.session) await openApp(data.session,email);
        else msg("Cuenta creada. Revisa tu correo para confirmar la cuenta y luego inicia sesión.");
      }catch(e){msg(e.message||"No se pudo crear la cuenta.",true)}
    };
    if(loginBtn)loginBtn.onclick=async function(){
      if(!client){msg("La conexión de acceso todavía no está disponible. Usa “Ver demo” para entrar ahora.",true);return}
      msg("Conectando…");
      try{
        const {data,error}=await client.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
        if(error)throw error;
        if(!data.session)throw new Error("No se recibió una sesión.");
        await openApp(data.session,data.user.email);
      }catch(e){msg(e.message||"No se pudo iniciar sesión.",true)}
    };
    if(!window.supabase){msg("La interfaz está disponible. La conexión de autenticación no respondió; entra con “Ver demo”.",true);return}
    try{
      client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const s=await client.auth.getSession();
      if(s.data?.session) await openApp(s.data.session,s.data.session.user.email);
    }catch(e){msg("La interfaz está disponible. Entra con “Ver demo” mientras se restablece la conexión de cuenta.",true)}
  }

  function bookingSummary(payload){
    const kind=payload?.booking_kind||"session";
    const names={wedding:"Boda",preboda:"Preboda",session:"Sesión",event:"Evento",other:"Reserva"};
    const label=names[kind]||"Reserva";
    if(!payload?.event_date)return label;

  function valueFrom(row,key){
    if(key==="project_id" && row.project_id){
      const p=(window.__photoosRelated?.projects||[]).find(x=>x.id===row.project_id); return p?.name||row.project_id;
    }
    if(key==="client_id" && row.client_id){
      const c=(window.__photoosRelated?.clients||[]).find(x=>x.id===row.client_id); return c?((c.first_name+" "+(c.last_name||"")).trim()):row.client_id;
    }
    if(["value","total_value","amount"].includes(key) && row[key]!=null)return Number(row[key]).toLocaleString("en-US",{maximumFractionDigits:2});
    if(["event_date","due_date"].includes(key)&&row[key])return new Date(row[key]+"T00:00:00").toLocaleDateString("es-DO");
    if(key==="paid_at"&&row[key])return new Date(row[key]).toLocaleDateString("es-DO");
    if(key==="status")return labelFor(row[key]);
    if(key==="booking_kind")return labelFor(row[key]);
    if(key==="start_time"&&row[key])return String(row[key]).slice(0,5);
    if(key==="duration_minutes"&&row[key])return Number(row[key])+" min";
    if(key==="reservation_status")return labelFor(row[key]);
    if(["active","selection_enabled","download_enabled","signed_by_client"].includes(key))return row[key]?"Sí":"No";
    if(["created_at","sent_at","submitted_at"].includes(key)&&row[key])return new Date(row[key]).toLocaleDateString("es-DO");
    return row[key]??"—";
  }

      if(demoMode){alert("Inicia sesión para crear enlaces públicos.");return}
      const projectId=document.getElementById("portalProject").value, linkType=document.getElementById("portalType").value;
      if(!projectId){alert("Selecciona un proyecto.");return}
      const q=await client.rpc("make_public_link",{p_workspace_id:activeWorkspaceId,p_project_id:projectId,p_link_type:linkType});
      if(q.error)alert(q.error.message);else await renderClientPortal();
    };
  }

  async function renderReports(){
    const page=document.querySelector(".page");
    page.innerHTML='<section class="hero"><div><div class="label">NEGOCIO</div><h1>Reportes</h1><p>Indicadores de clientes, proyectos y cobros.</p></div><button class="btn" id="refreshReport">Actualizar</button></section><div class="grid"><div class="card"><div class="label">Leads</div><div class="value" id="rpLeads">—</div></div><div class="card"><div class="label">Clientes</div><div class="value" id="rpClients">—</div></div><div class="card"><div class="label">Proyectos</div><div class="value" id="rpProjects">—</div></div><div class="card"><div class="label">Pagado</div><div class="value" id="rpPaid">—</div></div></div><section class="section"><div class="card"><div class="kpi-note" id="rpText">Calculando…</div></div></section>';
    try{const [l,cl,p,pay]=await Promise.all([relatedRows("leads"),relatedRows("clients"),relatedRows("projects"),relatedRows("payments")]);const paid=pay.filter(x=>x.status==="paid").reduce((s,x)=>s+Number(x.amount||0),0);document.getElementById("rpLeads").textContent=l.length;document.getElementById("rpClients").textContent=cl.length;document.getElementById("rpProjects").textContent=p.length;document.getElementById("rpPaid").textContent=paid.toLocaleString("en-US",{maximumFractionDigits:2});document.getElementById("rpText").textContent="Resumen: "+l.length+" leads, "+cl.length+" clientes, "+p.length+" proyectos y "+paid.toLocaleString("en-US",{maximumFractionDigits:2})+" pagados."; }catch(e){document.getElementById("rpText").textContent="No se pudo calcular el reporte.";}
    document.getElementById("refreshReport").onclick=()=>renderReports();
  }
  async function renderAI(){
    const page=document.querySelector(".page");
    page.innerHTML='<section class="hero"><div><div class="label">INTELIGENCIA</div><h1>IA de PHOTO OS</h1><p>Asistente operativo para ventas, seguimiento y producción.</p></div></section><section class="section"><div class="card"><div class="field"><label>¿Qué necesitas?</label><textarea id="aiPrompt" placeholder="Ej.: redacta un seguimiento para una pareja que no ha respondido."></textarea></div><div class="modal-actions"><button class="btn" id="askAI">Generar</button></div><div class="card" style="margin-top:14px;background:#f7f8f5"><div id="aiAnswer" class="kpi-note">La interfaz está lista. La conexión al proveedor de IA se agregará del lado seguro del servidor.</div></div></div></section>';
    document.getElementById("askAI").onclick=()=>{const p=document.getElementById("aiPrompt").value.trim();document.getElementById("aiAnswer").textContent=p?"Borrador recomendado: "+p+". Siguiente acción: crear una tarea, definir una fecha límite y preparar el mensaje al cliente.":"Escribe una solicitud.";};
  }

  async function renderProfile(){
    const page=document.querySelector(".page");let profile=null;if(currentSession&&!demoMode){try{profile=(await client.from("profiles").select("*").eq("id",currentSession.user.id).single()).data}catch(e){}}profile=profile||{full_name:"Pedro Ramirez",avatar_url:""};
    page.innerHTML='<section class="hero"><div><div class="label">CUENTA</div><h1>Perfil</h1><p>Información del usuario.</p></div><button class="btn" id="saveProfile">Guardar</button></section><section class="section"><div class="card"><div class="form-grid"><div><label>Nombre completo</label><input id="profileName" value="'+esc(profile.full_name||"")+'"></div><div><label>Correo</label><input value="'+esc(currentSession?.user?.email||"")+'" disabled></div><div class="full"><label>Avatar URL</label><input id="profileAvatar" value="'+esc(profile.avatar_url||"")+'"></div></div></div></section>';
    document.getElementById("saveProfile").onclick=async()=>{if(demoMode){alert("Guardado en modo demo.");return}const q=await client.from("profiles").upsert({id:currentSession.user.id,full_name:document.getElementById("profileName").value||null,avatar_url:document.getElementById("profileAvatar").value||null,updated_at:new Date().toISOString()});if(q.error)alert(q.error.message);else alert("Perfil actualizado.");};
  }const inc=await relatedRows("income"), exp=await relatedRows("expenses");
      const sum=a=>a.reduce((s,x)=>s+Number(x.amount||0),0);
      const i=sum(inc),e=sum(exp); document.getElementById("finIncome").textContent=i.toLocaleString("en-US",{maximumFractionDigits:2});document.getElementById("finExpense").textContent=e.toLocaleString("en-US",{maximumFractionDigits:2});document.getElementById("finNet").textContent=(i-e).toLocaleString("en-US",{maximumFractionDigits:2});
    }catch(err){}
    document.getElementById("openIncome").onclick=()=>showModule("Ingresos");
    document.getElementById("openExpense").onclick=()=>showModule("Gastos");
    document.getElementById("addIncome").onclick=()=>openForm("Ingresos");
  }
  async function renderTeam(){
    const page=document.querySelector(".page");
    page.innerHTML='<section class="hero"><div><div class="label">NEGOCIO</div><h1>Equipo</h1><p>Miembros y roles del workspace.</p></div><button class="btn" id="inviteBtn">Invitar miembro</button></section><section class="section"><div class="card table-wrap" id="teamList"><div class="empty">Cargando…</div></div></section>';
    try{
      if(demoMode){document.getElementById("teamList").innerHTML='<div class="empty">Modo demo. Inicia sesión para administrar miembros y permisos.</div>';return}
      const {data,error}=await client.from("workspace_members").select("user_id,role,created_at,profiles(full_name,avatar_url)").eq("workspace_id",activeWorkspaceId);
      if(error)throw error;
      document.getElementById("teamList").innerHTML='<table class="data-table"><thead><tr><th>Nombre</th><th>Rol</th><th>Desde</th></tr></thead><tbody>'+((data||[]).map(x=>'<tr><td>'+esc(x.profiles?.full_name||x.user_id)+'</td><td>'+esc(x.role)+'</td><td>'+new Date(x.created_at).toLocaleDateString("es-DO")+'</td></tr>').join("")||'<tr><td colspan="3">Sin miembros</td></tr>')+'</tbody></table>';
    }catch(e){document.getElementById("teamList").innerHTML='<div class="empty">'+esc(e.message||"No se pudo cargar el equipo.")+'</div>'}
    document.getElementById("inviteBtn").onclick=()=>alert("La invitación por correo será integrada en la siguiente etapa de Team/Permissions.");
  }
  async function renderSettings(){
    const page=document.querySelector(".page");
    let settings=null;
    if(!demoMode){try{const r=await client.from("workspace_settings").select("*").eq("workspace_id",activeWorkspaceId).maybeSingle();settings=r.data}catch(e){}}
    settings=settings||{business_name:activeWorkspaceName||"Pedro Ramirez Photos",email:"",phone:"",website:"",country:"DO",timezone:"America/Santo_Domingo",default_currency:"USD"};
    page.innerHTML='<section class="hero"><div><div class="label">CUENTA</div><h1>Configuración</h1><p>Datos del negocio, moneda, zona horaria y contacto.</p></div><button class="btn" id="saveSettings">Guardar cambios</button></section><section class="section"><div class="card"><form id="settingsForm"><div class="form-grid"><div><label>Nombre del negocio</label><input id="s_business_name" value="'+esc(settings.business_name)+'"></div><div><label>Correo</label><input id="s_email" type="email" value="'+esc(settings.email||"")+'"></div><div><label>Teléfono</label><input id="s_phone" value="'+esc(settings.phone||"")+'"></div><div><label>Sitio web</label><input id="s_website" value="'+esc(settings.website||"")+'"></div><div><label>País</label><input id="s_country" value="'+esc(settings.country||"DO")+'"></div><div><label>Zona horaria</label><input id="s_timezone" value="'+esc(settings.timezone||"America/Santo_Domingo")+'"></div><div><label>Moneda predeterminada</label><select id="s_currency"><option>DOP</option><option>USD</option><option>EUR</option></select></div></div></form></div></section>';
    document.getElementById("s_currency").value=settings.default_currency||"USD";
    document.getElementById("saveSettings").onclick=async()=>{
      if(demoMode){activeWorkspaceName=document.getElementById("s_business_name").value||activeWorkspaceName;alert("Guardado en modo demo.");return}
      const payload={workspace_id:activeWorkspaceId,business_name:document.getElementById("s_business_name").value,email:document.getElementById("s_email").value||null,phone:document.getElementById("s_phone").value||null,website:document.getElementById("s_website").value||null,country:document.getElementById("s_country").value||"DO",timezone:document.getElementById("s_timezone").value||"America/Santo_Domingo",default_currency:document.getElementById("s_currency").value};
      const q=await client.from("workspace_settings").upsert(payload);if(q.error)alert(q.error.message);else alert("Configuración guardada.");
    };
  }
  document.addEventListener("click",async e=>{
    const btn=e.target.closest(".nav button");
    if(btn){e.preventDefault();const label=btn.textContent.trim();if(label!=="Dashboard")await showModule(label);else location.reload();return}
    const mb=e.target.closest(".mobile button");
    if(mb){e.preventDefault();const t=mb.textContent.replace(/\s+/g," ").trim();if(t.includes("Inicio"))location.reload();else if(t.includes("CRM"))await showModule("Clientes");else if(t.includes("Calendario"))await showModule("Calendario");else if(t.includes("Menú")){document.querySelector(".sidebar")?.classList.toggle("show-mobile")}else if(t.includes("Nuevo"))await showModule("Proyectos")}
  });

  init();
})();
</script>
</body>
</html>
