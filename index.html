<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHOTO OS</title>
<style>
:root{--bg:#f5f5f1;--panel:#fff;--ink:#141914;--muted:#68716b;--line:#e4e7e2;--nav:#121713;--accent:#2f6f61;--accent2:#edf4f0;--shadow:0 18px 50px rgba(16,23,18,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}button{cursor:pointer}
.shell{min-height:100vh;display:flex}.sidebar{width:248px;background:var(--nav);color:#eef2ef;padding:18px 12px;flex:none}.brand{display:flex;gap:10px;align-items:center;padding:8px 12px 22px;font-weight:800;letter-spacing:.12em}.brand span{width:28px;height:28px;border:1px solid #6d7771;border-radius:9px;display:grid;place-items:center}.brand small{display:block;font-size:9px;letter-spacing:.04em;color:#8c9690;margin-top:3px}.nav-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7d8781;margin:16px 12px 7px}.nav button{display:block;width:100%;border:0;background:transparent;color:#d7ddd9;text-align:left;padding:10px 12px;border-radius:10px;margin:2px 0;font-size:12px}.nav button:hover,.nav button.active{background:#252d28;color:#fff}.main{flex:1;min-width:0}.top{height:70px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.search{width:min(520px,58vw);padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#f4f5f2;outline:0}.user{font-size:12px;color:var(--muted)}.page{padding:28px;max-width:1500px;margin:0 auto}.hero{background:linear-gradient(110deg,#ebe6dc,#d8d4ca);border:1px solid #d8d3c9;border-radius:20px;padding:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:18px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:#5e665f}.btn{border:0;border-radius:11px;background:var(--ink);color:#fff;padding:10px 14px;font-weight:700}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.label{font-size:11px;color:var(--muted)}.value{font-size:28px;font-weight:800;margin-top:6px}.sub{font-size:11px;color:var(--muted);margin-top:5px}.section{margin-top:16px}.section h2{font-size:17px;margin:0 0 10px}.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid #eef0ec;font-size:12px}.row:first-child{border-top:0}.pill{font-size:10px;font-weight:700;padding:5px 8px;background:var(--accent2);color:#4f6f63;border-radius:99px}.mobile{display:none}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.mark{width:42px;height:42px;border:1px solid #aab3ad;border-radius:13px;display:grid;place-items:center;margin-bottom:18px}.auth-card h1{margin:0 0 6px}.auth-card p{color:var(--muted);font-size:13px;line-height:1.5}.field{margin-top:12px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;outline:0}.stack{display:grid;gap:10px;margin-top:16px}.notice{margin-top:12px;background:#f1f3f0;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11px;color:#5f6861;display:none}.error{background:#fbefec;color:#875144;border-color:#efd0c8}.empty{padding:24px;text-align:center;color:var(--muted);font-size:12px}.hide{display:none!important}
@media(max-width:900px){.sidebar{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);height:62px;z-index:20;justify-content:space-around}.mobile button{border:0;background:none;font-size:11px;color:var(--muted)}.page{padding:18px 16px 82px}.top{padding:0 16px}.top .search{width:58vw}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.hero{display:block}.hero .actions{margin-top:16px}.hero h1{font-size:23px}.user{display:none}}
</style>
</head>
<body>
<div id="root">
  <section class="auth">
    <div class="auth-card">
      <div class="mark">◉</div>
      <h1>PHOTO OS</h1>
      <p>El sistema operativo para fotógrafos. Esta versión está publicada directamente y muestra el sistema aunque la autenticación o la base de datos todavía no estén disponibles.</p>
      <div id="login">
        <div class="field"><label>Correo</label><input id="email" type="email" autocomplete="email" placeholder="tu@email.com"></div>
        <div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
        <div class="stack"><button class="btn" id="loginBtn">Entrar</button><button class="btn secondary" id="demoBtn">Ver demo</button></div>
      </div>
      <div id="notice" class="notice"></div>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  const SUPABASE_URL="https://wuwthamswandybiukjmx.supabase.co";
  const SUPABASE_KEY="sb_publishable_Jc71FEPj1AtxU9DmZ6ujQ_kHUhxgXj";
  const root=document.getElementById("root"), notice=document.getElementById("notice");
  let client=null, state={projects:0,clients:0,leads:0,payments:0};
  function msg(t,err){notice.textContent=t;notice.className="notice"+(err?" error":"");notice.style.display="block"}
  function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
  function shell(name,rows){
    root.innerHTML='<div class="shell"><aside class="sidebar"><div class="brand"><span>◉</span><div>PHOTO OS<small>Business operating system</small></div></div><div class="nav"><div class="nav-title">Principal</div><button class="active">Dashboard</button><button>Leads</button><button>Clientes</button><div class="nav-title">Trabajo</div><button>Proyectos</button><button>Calendario</button><button>Tareas</button><div class="nav-title">Ventas</div><button>Cotizaciones</button><button>Contratos</button><button>Pagos</button><div class="nav-title">Entrega</div><button>Galerías</button><button>Entregas</button><div class="nav-title">Negocio</div><button>Finanzas</button><button>Servicios & paquetes</button><button>Automatizaciones</button><button>Equipo</button><div class="nav-title">Cuenta</div><button>Configuración</button></div></aside><main class="main"><header class="top"><input class="search" placeholder="Buscar clientes, proyectos, tareas…"><div class="user">'+esc(name||"PHOTO OS")+'</div></header><div class="page"><section class="hero"><div><div class="label">WORKSPACE</div><h1>'+esc(name||"Tu negocio fotográfico")+'</h1><p>PHOTO OS está conectado y la interfaz web está cargando correctamente.</p></div><div class="actions"><button class="btn" id="refresh">Actualizar</button></div></section><div class="grid"><div class="card"><div class="label">Leads</div><div class="value">'+rows.leads+'</div><div class="sub">En tu workspace</div></div><div class="card"><div class="label">Clientes</div><div class="value">'+rows.clients+'</div><div class="sub">Clientes activos</div></div><div class="card"><div class="label">Proyectos</div><div class="value">'+rows.projects+'</div><div class="sub">Trabajos registrados</div></div><div class="card"><div class="label">Pagos</div><div class="value">'+rows.payments+'</div><div class="sub">Registros de pago</div></div></div><section class="section"><h2>Estado de la plataforma</h2><div class="list"><div class="row"><span>Frontend</span><span class="pill">OK</span></div><div class="row"><span>Supabase</span><span class="pill" id="dbState">Conectando…</span></div><div class="row"><span>Diseño responsive</span><span class="pill">OK</span></div><div class="row"><span>Sesión</span><span class="pill" id="sessionState">Demo</span></div></div></section></div></main></div><nav class="mobile"><button>⌂<br>Inicio</button><button>◌<br>CRM</button><button>+<br>Nuevo</button><button>▦<br>Calendario</button><button>☰<br>Menú</button></nav>';
    document.getElementById("refresh").onclick=()=>location.reload();
  }
  async function getWorkspace(session){
    if(!client||!session)return null;
    try{
      const m=await client.from("workspace_members").select("workspace_id").eq("user_id",session.user.id).limit(1);
      if(m.error||!m.data?.[0])return null;
      const ws=await client.from("workspaces").select("id,name").eq("id",m.data[0].workspace_id).single();
      if(ws.error)return null;
      return ws.data;
    }catch(e){return null}
  }
  async function count(table,wsId){
    const r=await client.from(table).select("id",{count:"exact",head:true}).eq("workspace_id",wsId);
    return r.count||0;
  }
  async function openApp(session,name){
    const ws=await getWorkspace(session);
    const wsId=ws?.id; activeWorkspaceId=wsId; activeWorkspaceName=ws?.name||name||'PHOTO OS';
    const rows={leads:0,clients:0,projects:0,payments:0};
    if(wsId){
      rows.leads=await count("leads",wsId); rows.clients=await count("clients",wsId); rows.projects=await count("projects",wsId); rows.payments=await count("payments",wsId);
    }
    shell(name||(ws?.name||"PHOTO OS"),rows);
    document.getElementById("dbState").textContent=wsId?"Conectado":"Sin workspace";
    document.getElementById("sessionState").textContent=session?"Sesión activa":"Demo";
  }
  async function init(){
    if(!window.supabase){msg("La interfaz se cargó, pero el proveedor de autenticación no respondió. Puedes usar Ver demo.",true);return}
    try{
      client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const s=await client.auth.getSession();
      if(s.data?.session) await openApp(s.data.session,s.data.session.user.email);
    }catch(e){msg("PHOTO OS está cargando correctamente. La conexión de cuenta se podrá activar después.",true)}
    document.getElementById("loginBtn").onclick=async function(){
      msg("Conectando…");
      try{
        const {data,error}=await client.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});
        if(error)throw error;
        await openApp(data.session,data.user.email);
      }catch(e){msg(e.message||"No se pudo iniciar sesión.",true)}
    };
    document.getElementById("demoBtn").onclick=()=>openApp(null,"Pedro Ramirez Photos");
  }
  function moduleData(label){
    const map={
      "Leads":["Gestiona prospectos, origen, fecha del evento y valor estimado.","Nuevo lead","CRM"],
      "Clientes":["Base de clientes y contactos vinculados a sus proyectos.","Nuevo cliente","CRM"],
      "Proyectos":["Trabajos activos, fechas, estados, valor y flujo de producción.","Nuevo proyecto","Trabajo"],
      "Calendario":["Vista rápida de eventos, sesiones, entregas y fechas importantes.","Nuevo evento","Trabajo"],
      "Tareas":["Pendientes, responsables y fechas de entrega.","Nueva tarea","Trabajo"],
      "Cotizaciones":["Cotizaciones y propuestas comerciales para tus clientes.","Nueva cotización","Ventas"],
      "Contratos":["Contratos, versiones y estado de firma.","Nuevo contrato","Ventas"],
      "Pagos":["Cobros, anticipos, balances y movimientos asociados a proyectos.","Registrar pago","Ventas"],
      "Galerías":["Galerías de clientes y activos del proyecto.","Nueva galería","Entrega"],
      "Entregas":["Archivos y entregas finales por proyecto.","Nueva entrega","Entrega"],
      "Finanzas":["Ingresos, gastos y resumen financiero del negocio.","Registrar movimiento","Negocio"],
      "Servicios & paquetes":["Catálogo de servicios, paquetes y precios.","Nuevo servicio","Negocio"],
      "Automatizaciones":["Flujos automáticos para leads, reservas, pagos y entrega.","Nueva automatización","Negocio"],
      "Equipo":["Usuarios, colaboradores y permisos del workspace.","Invitar miembro","Negocio"],
      "Configuración":["Datos del negocio, preferencias, notificaciones y seguridad.","Editar configuración","Cuenta"]
    };
    return map[label]||["Módulo de PHOTO OS.","Nuevo","PHOTO OS"];
  }
  async function showModule(label){
    const oldPage=document.querySelector(".page");
    if(!oldPage)return;
    document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.textContent.trim()===label));
    const [desc,action,group]=moduleData(label);
    let listHtml="";
    if(client && activeWorkspaceId && ["Leads","Clientes","Proyectos","Pagos"].includes(label)){
      const table=label.toLowerCase()==="leads"?"leads":label.toLowerCase()==="clientes"?"clients":label.toLowerCase()==="proyectos"?"projects":"payments";
      const cols=label==="Leads"?["name","email","status","event_date","value"]:label==="Clientes"?["name","email","phone"]:label==="Proyectos"?["name","status","event_date","total_value"]:["amount","status","payment_date","method"];
      try{
        const q=await client.from(table).select(cols.join(",")).eq("workspace_id",activeWorkspaceId).order(label==="Pagos"?"payment_date":"created_at",{ascending:false}).limit(8);
        if(!q.error && q.data?.length){
          listHtml='<div class="list">'+q.data.map(x=>'<div class="row"><span>'+esc(x.name||x.email||x.amount||"Registro")+'</span><span class="pill">'+esc(x.status||x.event_date||x.payment_date||"Ver")+'</span></div>').join("")+'</div>';
        }else listHtml='<div class="card empty">No hay registros todavía.</div>';
      }catch(e){listHtml='<div class="card empty">No se pudieron cargar los registros.</div>';}
    }
    oldPage.innerHTML='<section class="hero"><div><div class="label">'+esc(group)+'</div><h1>'+esc(label)+'</h1><p>'+esc(desc)+'</p></div><div class="actions"><button class="btn" id="moduleAction">'+esc(action)+'</button></div></section><div class="grid"><div class="card"><div class="label">Estado</div><div class="value">Activo</div><div class="sub">Módulo disponible</div></div><div class="card"><div class="label">Workspace</div><div class="value">1</div><div class="sub">'+esc(activeWorkspaceName||"PHOTO OS")+'</div></div><div class="card"><div class="label">Acceso</div><div class="value">100%</div><div class="sub">Interfaz habilitada</div></div><div class="card"><div class="label">Acción rápida</div><div class="value">+</div><div class="sub">'+esc(action)+'</div></div></div><section class="section"><h2>Actividad del módulo</h2>'+listHtml+'<div class="card empty" style="margin-top:12px">La estructura del módulo ya está conectada a PHOTO OS. Los formularios y acciones específicas se irán habilitando sobre esta misma pantalla.</div></section>';
    const btn=document.getElementById("moduleAction");
    if(btn)btn.onclick=()=>alert(action+" — siguiente etapa del módulo");
  }
  let activeWorkspaceId=null, activeWorkspaceName=null;
  document.addEventListener("click", async (e)=>{
    const btn=e.target.closest(".nav button");
    if(btn){
      e.preventDefault();
      const label=btn.textContent.trim();
      if(label!=="Dashboard") await showModule(label);
      else location.reload();
      return;
    }
    const mb=e.target.closest(".mobile button");
    if(mb){
      e.preventDefault();
      const t=mb.textContent.replace(/\s+/g," ").trim();
      if(t.includes("Inicio")) location.reload();
      else if(t.includes("CRM")) await showModule("Clientes");
      else if(t.includes("Calendario")) await showModule("Calendario");
      else if(t.includes("Menú")) alert("Usa el menú lateral en escritorio o abre PHOTO OS en una pantalla más grande.");
      else if(t.includes("Nuevo")) await showModule("Proyectos");
    }
  });

  init();
})();
</script>
</body>
</html>
